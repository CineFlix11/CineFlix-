<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CineFlix</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#100b18;color:white;font-family:Arial,sans-serif}
header{background:#1c1029;padding:22px;text-align:center;border-bottom:2px solid #a020f0}
h1{color:#c77dff;font-size:36px;margin:0}
header p{color:#ddd}
main{padding:20px}
input{width:100%;padding:14px;border:1px solid #a020f0;border-radius:10px;background:#21162d;color:white;font-size:16px}
h2{color:#c77dff}
.filmes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.card{background:#21162d;border-radius:12px;overflow:hidden;text-align:center;padding-bottom:15px}
.poster{height:145px;background:linear-gradient(135deg,#4b126b,#130d20);display:flex;align-items:center;justify-content:center;font-size:42px}
.card h3{font-size:16px}
.card p{font-size:13px;color:#ccc}
button{background:#9b25db;color:white;border:0;padding:10px 14px;border-radius:8px;font-weight:bold}
footer{text-align:center;padding:25px;color:#aaa;font-size:13px}
</style>
</head>
<body>
<header>
<h1>🎬 CineFlix</h1>
<p>Seu próximo filme favorito começa aqui!</p>
</header>
<main>
<input id="busca" placeholder="🔎 Buscar filmes e séries..." oninput="buscar()">
<h2>🍿 Em destaque</h2>
<div class="filmes" id="lista">
<div class="card"><div class="poster">🚀</div><h3>Aventura Espacial</h3><p>Ficção científica</p><button onclick="info('Aventura Espacial')">Saiba mais</button></div>
<div class="card"><div class="poster">🦸</div><h3>Heróis do Amanhã</h3><p>Ação e aventura</p><button onclick="info('Heróis do Amanhã')">Saiba mais</button></div>
<div class="card"><div class="poster">🕵️</div><h3>O Grande Mistério</h3><p>Suspense</p><button onclick="info('O Grande Mistério')">Saiba mais</button></div>
<div class="card"><div class="poster">🌌</div><h3>Mundos Mágicos</h3><p>Fantasia</p><button onclick="info('Mundos Mágicos')">Saiba mais</button></div>
</div>
</main>
<footer>© CineFlix — Catálogo demonstrativo</footer>
<script>
function buscar(){
let q=document.getElementById('busca').value.toLowerCase();
document.querySelectorAll('.card').forEach(c=>{
c.style.display=c.innerText.toLowerCase().includes(q)?'block':'none';
});
}
function info(nome){
alert(nome+' — título demonstrativo. Os vídeos ainda não estão disponíveis.');
}
</script>
</body>
</html>
